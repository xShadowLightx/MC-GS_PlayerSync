name: MC-GAPI
version: V-2.1.1
main: xyz.shadowlight.joinexporter.JoinExporterPlugin
api-version: "1.21"
author: xShadowLightx
description: Exports Minecraft player data to Google Sheets


softdepend:
  - LuckPerms
  - Vault
  - CMI

commands:
  mcgapi:
    description: MC-GAPI commands
    usage: /mcgapi <export|player <name>|mydata|ingame <name>|delete <player|uuid>|reload>

  exportjoins:
    description: Export all known players to Google Sheets
    usage: /exportjoins
    permission: joinexporter.export

  exportplayer:
    description: Export one player to Google Sheets
    usage: /exportplayer <name>
    permission: joinexporter.export

  joinexporterreload:
    description: Reload MC-GAPI config
    usage: /joinexporterreload
    permission: joinexporter.reload

permissions:
  mcgapi.export:
    description: Allows exporting player data with MC-GAPI
    default: op

  mcgapi.reload:
    description: Allows reloading the MC-GAPI config
    default: op

  mcgapi.delete:
    description: Allows deleting a player's exported data
    default: op

  mcgapi.view-others:
    description: Allows viewing another player's export data in game
    default: op

  mcgapi.update-notify:
    description: Receives MC-GAPI update notifications when joining
    default: op

  joinexporter.export:
    description: Legacy permission; also allows MC-GAPI exports
    default: op

  joinexporter.reload:
    description: Legacy permission; also allows MC-GAPI config reloads
    default: op

  joinexporter.update-notify:
    description: Legacy permission; also allows MC-GAPI update notifications
    default: op
