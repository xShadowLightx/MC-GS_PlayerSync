    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55e7d0"/>
      <stop offset="1" stop-color="#3aa9ff"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75f0c5"/>
      <stop offset="1" stop-color="#27b879"/>
