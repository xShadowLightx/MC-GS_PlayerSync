<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="title description">
  <title id="title">MC-GAPI</title>
  <desc id="description">A pixel inspired Google Sheets export mark beside the MC-GAPI wordmark.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172235"/>
