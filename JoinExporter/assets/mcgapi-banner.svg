  <path d="M100 145h23v20h-23zM130 145h23v20h-23zM160 145h17v20h-17z" fill="#c6d9e8"/>
  <path d="M100 174h23v12h-23zM130 174h23v12h-23zM160 174h17v12h-17z" fill="url(#accent)"/>
  <path d="M54 104v56" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="54" cy="91" r="7" fill="#a7f3d0"/>
  <circle cx="54" cy="173" r="7" fill="#a7f3d0"/>

  <text x="282" y="132" fill="#111827" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="-4">MC-<tspan fill="#18b9a5">GAPI</tspan></text>
  <text x="290" y="181" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">MINECRAFT  →  GOOGLE SHEETS</text>
